<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" role="img"><title>Tři programy, jedno AI jádro</title><defs><marker id="ah1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606A"/></marker><marker id="ah0" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#57606A"/></marker></defs><rect width="1000" height="470" rx="16" fill="#FFFFFF" stroke="#D0D7DE"/><text x="30" y="40" font-size="20" font-weight="700" fill="#24292F" text-anchor="start">Tři programy, jedno AI jádro</text><rect x="40" y="70" width="920" height="64" rx="10" fill="#F1ECFE" stroke="#7C5CE0" stroke-width="1.6"/><text x="500.0" y="96" font-size="15" font-weight="650" fill="#3B2A8C" text-anchor="middle">Claude · Codex · lokální Hermes</text><text x="500.0" y="118" font-size="13" font-weight="400" fill="#3D434A" text-anchor="middle">stříhají podle obsahu – vždy do NOVÉ sekvence</text><rect x="40" y="180" width="290" height="96" rx="10" fill="#E8F1FD" stroke="#2F74D0" stroke-width="1.6"/><text x="185.0" y="206" font-size="15" font-weight="650" fill="#123F78" text-anchor="middle">1 · Premiere plugin</text><text x="185.0" y="228" font-size="13" font-weight="400" fill="#3D434A" text-anchor="middle">panel v Adobe Premiere Pro</text><text x="185.0" y="247" font-size="13" font-weight="400" fill="#3D434A" text-anchor="middle">1 Premiere plugin - instalace.bat</text><path d="M185,134 L185,180" fill="none" stroke="#57606A" stroke-width="1.8" marker-start="url(#ah0)" marker-end="url(#ah1)"/><rect x="355" y="180" width="290" height="96" rx="10" fill="#E8F1FD" stroke="#2F74D0" stroke-width="1.6"/><text x="500.0" y="206" font-size="15" font-weight="650" fill="#123F78" text-anchor="middle">2 · Standalone</text><text x="500.0" y="228" font-size="13" font-weight="400" fill="#3D434A