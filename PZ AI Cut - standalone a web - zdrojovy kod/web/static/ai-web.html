<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PZ AI</title>
<!-- S14 Web: panel měl jako jediný bez CSP (vložený handler by dosáhl na parent.TN) – jen vlastní skript, žádné vložené -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' http://127.0.0.1:* http://localhost:*; object-src 'none'; base-uri 'none'; form-action 'none'">
<style>
  :root { --bg: #17161c; --card: #1f1e26; --card2: #26252f; --line: #34323f; --text: #ecebf3; --dim: #a19fb3; --accent: #8b5cf6; --accent2: #a78bfa; --ok: #22c55e; --err: #f87171; --warn: #fbbf24; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px "Segoe UI", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  .head { display: flex; align-items: center; gap: 8px; padding: 12px 14px 10px; font-size: 17px; font-weight: 700; }
  .head .sp { flex: 1; }
  .pill { font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 3px; border: 1.5px solid #6b2a36; background: #3a1d24; color: #fca5a5; white-space: nowrap; }
  .collapse { width: 24px; height: 24px; padding: 0; margin-left: 4px; background: transparent; border: 0; color: #a19fb3; font-size: 15px; cursor: pointer; border-radius: 3px; }
  .collapse:hover { color: #fff; background: rgba(255,255,255,.06); }
  .pill.on { border-color: #2f6f45; background: rgba(34,197,94,.1); color: #4ade80; }
  .pane { flex: 1; overflow: auto; padding: 0 14px 14px; display: flex; flex-direction: column; gap: 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 3px; padding: 11px 13px; line-height: 1.5; }
  .card h3 { margin: 0 0 8px; font-size: 13.5px; }
  .dim { color: var(--dim); }
  a { color: var(--accent2); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 14px; border-radius: 3px; border: 1px solid var(--line); background: var(--card2); color: var(--text); cursor: pointer; font: inherit; font-weight: 600; text-decoration: none; white-space: nowrap; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.small { height: 26px; padding: 0 10px; font-size: 12px; }
  .btn:hover { filter: brightness(1.12); }
  .seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 10px; }
  .seg button { height: 32px; border: 0; background: var(--card2); color: var(--dim); font: inherit; font-weight: 600; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--accent); color: #fff; }
  .steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; counter-reset: st; }
  .steps > li { position: relative; padding-left: 28px; counter-increment: st; }
  .steps > li::before { content: counter(st); position: absolute; left: 0; top: 0; width: 20px; height: 20px; border-radius: 3px; background: var(--card2); border: 1px solid var(--line); font-size: 11.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .steps .sub { font-size: 12px; color: var(--dim); margin-top: 4px; }
  .steps .act { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  code, .code { font: 12px Consolas, "Cascadia Mono", monospace; }
  .code { display: block; background: #111016; border: 1px solid var(--line); border-radius: 3px; padding: 7px 9px; margin-top: 6px; word-break: break-all; user-select: all; }
  .wait { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--dim); }
  .wait.bad { color: #fecaca; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); flex: none; animation: pulse 1.4s infinite; }
  .wait.bad .dot { background: var(--err); animation: none; }
  @keyframes pulse { 50% { opacity: .3; } }
  .quick { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .quick button { height: 38px; text-align: left; padding: 0 11px; border-radius: 3px; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; font: inherit; font-weight: 600; }
  .quick button:hover { border-color: var(--accent); }
  .presets { display: flex; flex-direction: column; gap: 6px; }
  .presets .ttl { font-size: 12px; font-weight: 600; color: var(--dim); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { height: 26px; padding: 0 9px; border-radius: 3px; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; font: inherit; font-size: 12px; font-weight: 600; }
  .chip:hover { border-color: var(--accent2); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .fmts { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .fmt { display: flex; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 3px; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; font: inherit; text-align: left; }
  .fmt:hover { border-color: var(--accent2); }
  .fmt.on { border-color: var(--accent); background: rgba(139,92,246,.16); }
  .fmt .shape { flex: none; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; }
  .fmt .shape i { display: block; border: 1.5px solid var(--accent2); border-radius: 1px; }
  .fmt b { display: block; font-size: 12px; }
  .fmt span { display: block; font-size: 11px; color: var(--dim); line-height: 1.3; }
  .adds { font-size: 12px; color: var(--accent2); min-height: 16px; }
  textarea { width: 100%; min-height: 86px; resize: vertical; background: var(--card); border: 1px solid var(--line); border-radius: 3px; color: var(--text); font: inherit; padding: 9px 10px; }
  textarea:focus { outline: none; border-color: var(--accent); }
  .row { display: flex; gap: 8px; align-items: center; }
  .row .grow { flex: 1; }
  .label { font-weight: 600; margin-bottom: -4px; }
  .bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; } .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .log { display: flex; flex-direction: column; gap: 3px; font-size: 12px; max-height: 260px; overflow: auto; }
  .log div { padding: 3px 6px; border-left: 2px solid var(--line); }
  .log .task { border-color: var(--accent); color: #ddd6fe; } .log .ok { border-color: var(--ok); } .log .err { border-color: var(--err); color: #fecaca; } .log .call { color: var(--dim); }
  select { height: 30px; background: var(--card2); border: 1px solid var(--line); border-radius: 3px; color: var(--text); font: inherit; padding: 0 6px; }
  .hint { font-size: 12px; color: var(--dim); }
  .res { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 12px; align-items: center; }
  .res .k { color: var(--dim); }
  .meter { display: flex; align-items: center; gap: 8px; }
  .meter .bar { width: 90px; flex: none; }
  .meter .bar.hi i { background: var(--warn); } .meter .bar.crit i { background: var(--err); }
  .result { border-color: #4c3a8a; background: linear-gradient(180deg, rgba(139,92,246,.14), var(--card)); }
  .result .rhead { display: flex; flex-direction: column; gap: 2px; }
  .result .rlabel { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--accent2); }
  .result b { font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hint.warn { color: #fcd34d; border-left: 2px solid #f59e0b; padding: 4px 8px; background: rgba(245,158,11,.08); }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid var(--line); margin: 0 -14px 4px; padding: 0 14px; position: sticky; top: 0; background: var(--bg); z-index: 2; }
  .tabs button { height: 34px; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--dim); font: inherit; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 7px; }
  .tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
  .tabs button:hover { color: var(--text); }
  .tdot { width: 7px; height: 7px; border-radius: 50%; background: var(--err); display: inline-block; }
  .tdot.on { background: var(--ok); }
  .tabbody { display: flex; flex-direction: column; gap: 10px; }
  .hidden { display: none !important; }
  .privacy { font-size: 11.5px; color: var(--dim); border-top: 1px solid var(--line); padding-top: 8px; }
</style>
</head>
<body>
  <div class="head">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="#a78bfa"><path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8z"/></svg>
    <span>PZ AI</span><span class="sp"></span>
    <span class="pill" id="pill"></span>
    <button class="collapse" id="collapse" title="Collapse the AI panel (F4)">»</button>
  </div>
  <div class="pane" id="pane"></div>
<script src="ai-web.js"></script>
</body>
</html>
