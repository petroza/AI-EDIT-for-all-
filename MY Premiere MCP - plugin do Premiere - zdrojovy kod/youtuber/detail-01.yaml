  velke: ["AI prezentace", "Prezentace!"]      # velký zvýrazňovač nahoře
  vyradit: ["AI udělala prezentaci sama", "Dům v Praze ze dvou promptů", "Která prezentace vyhrála?", "Prompt: Cestovní kancelář"]
  cta:
    - {obsahuje: komentář, text: Napište do komentářů, velke: DETAIL, delka: 4.2}
    - {obsahuje: pod videem, text: Prompt najdete pod videem, velke: "", delka: 3.4}

