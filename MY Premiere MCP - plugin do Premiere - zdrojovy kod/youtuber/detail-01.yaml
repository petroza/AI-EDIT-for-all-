    potratech: Potterových
    potraťech: Potterových
    produkci: predikci
    odměňu: odměňuje
    suchoprdi: suchopáry
  fraze:
    - ["5 -5C", "5.5"]
    - ["ODMĚŇUJE JEHO", "ODMĚŇUJE HO"]
    - ["HLEDRY SE", "HLEDÁŠ SE"]
    - ["KOHOLEK", "KOLEGO"]
    - ["PŘEDSEBRNODÁVKY", "PŘEDSEBEVĚDOMÉ"]

